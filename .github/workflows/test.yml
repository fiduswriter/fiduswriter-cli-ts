name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22]
        steps:
            - uses: actions/checkout@v7

            - name: Install Pandoc
              run: |
                  # Forgejo runners execute jobs in containers without sudo,
                  # so install directly when running as root.
                  if [ "$(id -u)" = "0" ]; then
                      apt-get update
                      apt-get install -y pandoc
                  else
                      sudo apt-get update
                      sudo apt-get install -y pandoc
                  fi

            - uses: pnpm/action-setup@v4

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm test
